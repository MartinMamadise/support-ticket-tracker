name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build and tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Unit, MockMvc and H2 integration tests (the same Flyway migrations as production), then the jar.
      - run: ./mvnw -B verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports

  frontend:
    name: Frontend (lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:ci
      - run: npm run build

  docker:
    name: Docker images and compose file
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: cp .env.example .env && docker compose config -q
      - run: docker build -t supporthub-backend:ci backend
      - run: docker build -t supporthub-frontend:ci frontend

  e2e:
    name: End-to-end (Playwright against docker compose)
    runs-on: ubuntu-latest
    needs: [docker]
    env:
      E2E_BASE_URL: http://localhost:8080
      E2E_ADMIN_USERNAME: admin
      E2E_ADMIN_PASSWORD: ci-Admin-pass-123
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack (throw-away CI credentials)
        run: |
          cat > .env <<ENV
          DB_USERNAME=supporthub
          DB_PASSWORD=ci-db-password
          MYSQL_ROOT_PASSWORD=ci-root-password
          BOOTSTRAP_USER_ENABLED=true
          BOOTSTRAP_USER_USERNAME=${E2E_ADMIN_USERNAME}
          BOOTSTRAP_USER_EMAIL=admin@example.com
          BOOTSTRAP_USER_PASSWORD=${E2E_ADMIN_PASSWORD}
          ENV
          docker compose up --build -d --wait --wait-timeout 300
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color > compose.log; tail -200 compose.log
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
      - if: always()
        run: docker compose down -v
