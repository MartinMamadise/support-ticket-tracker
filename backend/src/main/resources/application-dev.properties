# Local development: run with SPRING_PROFILES_ACTIVE=dev (or --spring.profiles.active=dev).
# Everything else comes from application.properties; the database settings and migrations are the same as in production.

# OpenAPI document at /v3/api-docs and Swagger UI at /swagger-ui.html
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true

# Local development runs over plain http, so the session and CSRF cookies cannot be Secure here.
server.servlet.session.cookie.secure=false
app.security.secure-cookies=false
app.cors.allowed-origins=http://localhost:4200
