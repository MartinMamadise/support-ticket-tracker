spring.application.name=support-ticket-tracker

# Database connection. Credentials come from environment variables - never commit them.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:support_ticket_tracker}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# The schema is owned by Flyway (src/main/resources/db/migration); the application user therefore needs DDL rights.
# Hibernate never creates or alters tables - it only checks at startup that the entities match the schema
# and refuses to start if they do not. This applies to every profile.
spring.flyway.locations=classpath:db/migration
# Set FLYWAY_BASELINE_ON_MIGRATE=true once, to adopt a database that was created by Hibernate before Flyway was
# introduced (see README, "Adopting an existing database"). The default refuses to touch a non-empty,
# unversioned schema.
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=1
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Store and read timestamps (java.time.Instant) as UTC regardless of the server's time zone.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# API documentation is not published by default. The "dev" profile (application-dev.properties) turns it on.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# --- Authentication (Spring Security, session cookie) ---
# Session cookie: HttpOnly (not readable by scripts), SameSite=Lax, Secure by default. Local development over plain
# http: the "dev" profile turns Secure off. Behind a TLS-terminating proxy keep it on.
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
# Same flag for the XSRF-TOKEN cookie (read by SecurityConfig).
app.security.secure-cookies=${SESSION_COOKIE_SECURE:true}
app.security.bcrypt-strength=12
# Comma separated browser origins allowed to call the API with cookies. Empty = same-origin only (the Angular dev
# server proxies /api, so it needs nothing). The dev profile allows http://localhost:4200.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
# Optional first-start account, see BootstrapUserRunner. Credentials only from the environment.
app.bootstrap-user.enabled=${BOOTSTRAP_USER_ENABLED:false}
app.bootstrap-user.username=${BOOTSTRAP_USER_USERNAME:}
app.bootstrap-user.email=${BOOTSTRAP_USER_EMAIL:}
app.bootstrap-user.password=${BOOTSTRAP_USER_PASSWORD:}
# Role of that first account: ADMIN (default, so a fresh installation can manage roles), SUPPORT_AGENT or USER.
app.bootstrap-user.role=${BOOTSTRAP_USER_ROLE:ADMIN}

# Entities are mapped to DTOs inside the service transactions; no lazy loading during view rendering.
spring.jpa.open-in-view=false

# --- Attachments (Command 13) ---
# Directory for uploaded files. Must not be inside anything a web server publishes. Docker mounts a volume here.
app.attachments.dir=${ATTACHMENTS_DIR:./data/attachments}
# 5 MB per file; the multipart limit is a little higher so oversized files get the service's own 400 message,
# and anything far larger is cut off by the container with 413.
app.attachments.max-bytes=5242880
app.attachments.max-per-ticket=20
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=6MB

# --- SLA monitor (Command 11): notifications for approaching / missed deadlines ---
app.sla.monitor.enabled=${SLA_MONITOR_ENABLED:true}
app.sla.monitor.interval-ms=60000

# --- Health checks (Spring Boot Actuator) ---
# Only /actuator/health (and its liveness/readiness groups) is exposed, and it reports UP/DOWN without details.
# It includes the database check.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# --- Brute-force protection on sign-in: N failures per username within the window, then 429 until it passes ---
app.security.login.max-failures=5
app.security.login.window-minutes=15
