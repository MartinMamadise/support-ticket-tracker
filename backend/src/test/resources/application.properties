# Tests run against an in-memory H2 database (MySQL compatibility mode),
# so they need no running MySQL server and no credentials.
spring.datasource.url=jdbc:h2:mem:tickets_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Same schema management as production: the Flyway migrations create the schema and Hibernate validates it,
# so a mismatch between entities and migrations fails the test run.
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# The OpenAPI document is generated in tests so its content can be asserted. Swagger UI is not needed.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=false

# Authentication in tests: cheap BCrypt (strength 4 is the minimum), cookies not Secure (MockMvc is plain http),
# CORS for the Angular dev origin so the CORS configuration can be asserted.
app.security.bcrypt-strength=4
app.security.secure-cookies=false
server.servlet.session.cookie.secure=false
app.cors.allowed-origins=http://localhost:4200
app.bootstrap-user.enabled=false

# Features added in Commands 7B-18: no background SLA job during tests (tests call SlaMonitor directly),
# attachments in a throw-away directory.
app.sla.monitor.enabled=false
app.attachments.dir=${java.io.tmpdir}/supporthub-test-attachments
spring.jpa.open-in-view=false
# Integration tests sign in with wrong passwords on purpose many times; the limiter itself is unit-tested.
app.security.login.max-failures=1000
